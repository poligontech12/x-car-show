# The database, and nothing else.
#
# On the show server the app is built, health-checked and promoted by the
# x-car-show-deploy timer, which owns the `x-car-show-live` container. This
# file exists so Postgres runs alongside it and — crucially — survives every
# one of those deployments untouched.
#
#   docker compose up -d
#
# Migrations are not run from here. The app image applies them on start, so
# a deploy that cannot migrate fails its health check and rolls back to the
# container that was already working.

services:
  db:
    image: postgres:17-alpine
    container_name: x-car-show-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: xcs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: xcarshow
    # Published on the Docker bridge gateway: every container on the default
    # bridge can reach it, the office LAN cannot. If the app container runs
    # on a user-defined network instead, add this service to that network and
    # connect to the host name `x-car-show-db` rather than an IP.
    ports:
      - '${DB_BIND:-172.17.0.1}:${DB_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      # pg_dump writes here; copy this directory off the machine.
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U xcs -d xcarshow']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db-data:
