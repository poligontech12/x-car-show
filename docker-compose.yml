# A database and the app. TLS and the hostname are handled by the proxy
# already running on the server, so nothing here binds :80 or :443 — the
# app is published on a local port for that proxy to forward to.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: xcs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: xcarshow
    volumes:
      - db-data:/var/lib/postgresql/data
      # pg_dump writes here; back this directory up off the machine.
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U xcs -d xcarshow']
      interval: 10s
      timeout: 5s
      retries: 10

  # Run once per deploy, before the app comes up:
  #   docker compose run --rm migrate
  migrate:
    build:
      context: .
      target: builder
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    profiles: ['tools']
    environment:
      DATABASE_URL: postgres://xcs:${POSTGRES_PASSWORD}@db:5432/xcarshow
    command: npm run db:deploy
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://xcs:${POSTGRES_PASSWORD}@db:5432/xcarshow
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    volumes:
      - uploads:/app/uploads
    # Reachable only from the server itself, which is where the proxy is.
    # If your proxy runs in Docker instead, drop the 127.0.0.1 prefix and
    # put both on the same network rather than opening this to the world.
    ports:
      - '${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  uploads:
