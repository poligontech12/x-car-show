# The whole show: a database, the app, and something in front doing TLS.
# The same file runs on the office server and on any machine with Docker.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: xcs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: xcarshow
    volumes:
      - db-data:/var/lib/postgresql/data
      # pg_dump writes here; back this directory up off the machine.
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U xcs -d xcarshow']
      interval: 10s
      timeout: 5s
      retries: 10

  # Run once per deploy, before the app comes up:
  #   docker compose run --rm migrate
  migrate:
    build:
      context: .
      target: builder
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    profiles: ['tools']
    environment:
      DATABASE_URL: postgres://xcs:${POSTGRES_PASSWORD}@db:5432/xcarshow
    command: npm run db:deploy
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://xcs:${POSTGRES_PASSWORD}@db:5432/xcarshow
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      SITE_HOST: ${SITE_HOST:?set SITE_HOST in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:
